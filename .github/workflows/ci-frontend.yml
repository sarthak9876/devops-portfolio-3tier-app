name: CI Frontend

on:
  push:
    branches: [main]
    path:
      - 'application/frontned/**'
      - '.github/workflows/ci-frontend.yml'

  pull_request:
    branches: [main]
    path:
      - 'application/frontend/**'
      - '.github/workflows/ci-frontend.yml'


jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install dependencies
        working-directory: application/frontend
        run: npm ci

      - name: Lint
        working-directory: application/frontend
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found. Skipping..."

      - name: Test/Build
        working-directory: application/frontend
        run: |
          if npm run | grep -q "test"; then
            if cat package.json | grep -q "jest"; then
              npm run -- --passWithNoTests
            fi
          else
            echo "No tests found. Proceeding with Build"
            if npm run | grep -q "build"; then
              npm run build
            fi
          fi
