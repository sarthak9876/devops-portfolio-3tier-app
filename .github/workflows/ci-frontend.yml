name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - 'application/frontend/**'
      - '.github/workflows/ci-frontend.yml'

  pull_request:
    branches: [main]
    paths:
      - 'application/frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install dependencies
        working-directory: application/frontend
        run: npm ci

      - name: Lint
        working-directory: application/frontend
        run: |
          if npm pkg get scripts.lint | grep -qv null; then
            npm run lint
          else
            echo "No lint script found. Skipping..."
          fi

      - name: Test
        working-directory: application/frontend
        run: |
          if npm pkg get scripts.test | grep -qv null; then
            npm test -- --passWithNoTests
          else
            echo "No test script found. Skipping..."
          fi

      - name: Build
        working-directory: application/frontend
        run: |
          if npm pkg get scripts.build | grep -qv null; then
            npm run build
          else
            echo "No build script found. Skipping..."
          fi
