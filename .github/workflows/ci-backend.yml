name: CI Backend

on:
  push:
    branches: [main]
    paths:
       - 'application/backend/**'
       - '.github/workflows/ci-backend.yml'
  pull_requests:
    branches: [main]
    paths:
      - 'application/backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: application/backend/package-lock.json


      - name: Install dependencies
        working_directory: application/backend
        run: npm ci

      - name: Lint
        working-directory: application/backend
        run: |
          if num run | grep -q "lint"; then
            npm run lint
          else 
            echo "No lint script found. Skipping..."
          fi

      - name: Test
        working-directory: application/backend
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No tests found. Running build if available..."
            if npm run | grep -q "build"; then
              npm run build
            fi
          fi
