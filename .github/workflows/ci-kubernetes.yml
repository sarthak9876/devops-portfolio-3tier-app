name: CI Kubernetes Manifests

on:
  push:
    branches: [main]
    paths:
      - 'kubernetes/manifests/**'
      - '.github/workflows/ci-kubernetes.yml'


  pull_request:
    branches: [main]
    paths:
      - 'kubernetes/manifests/**'
      - '.github/workflows/ci-kubernetes.yml'


jobs:
  validate-k8s:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          varsion: latest

      - name: Install PyYAML
        run: |
          python -m pip install --user pyyaml

      - name: Basic YAML check
        run: |
          echo "Checking Kubernetes YAML syntax..."
          find kubernetes/manifests -name '*.yaml' -o -name '*.yml' | while read file; do
            echo "Validating $file"
            FILE="$file" python - << 'PYCODE'
import os
import yaml

file_path = os.environ["FILE"]
with open(file_path, "r") as f:
    # Parse all YAML documents in the file; will raise if any doc is invalid
    for _ in yaml.safe_load_all(f):
        pass
PYCODE
          done

      - name: Client-side apply dry-run
        run: |
          echo "Running kubectl apply --dry-run=client on manifests..."
          kubectl apply --dry-run=client -f kubernetes/manifests


