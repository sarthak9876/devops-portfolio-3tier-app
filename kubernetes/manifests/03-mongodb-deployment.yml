# ═══════════════════════════════════════════════════════
# MongoDB Deployment
# Single replica for dev environment
# 
# Production considerations:
# - Use StatefulSet with 3 replicas
# - Use PersistentVolumeClaim with gp3 EBS
# - Enable authentication and TLS
# - Use MongoDB Operator for better management
# ═══════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: taskmaster-dev
  labels:
    app: mongodb
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        tier: database
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
          name: mongodb
          protocol: TCP
        
        env:
        # MongoDB root credentials
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: taskmaster-secrets
              key: MONGO_ROOT_USER
        
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: taskmaster-secrets
              key: MONGO_ROOT_PASSWORD
        
        # MongoDB database to create
        - name: MONGO_INITDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: taskmaster-config
              key: MONGO_DATABASE
        
        # Resource limits (critical for cluster stability)
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Liveness probe (is container alive?)
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe (is container ready to serve traffic?)
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Volume mount for data persistence
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
      
      # Volume (ephemeral for dev, use PVC in prod)
      volumes:
      - name: mongodb-data
        emptyDir: {}
        # In production, use PersistentVolumeClaim:
        # persistentVolumeClaim:
        #   claimName: mongodb-pvc
---
# ═══════════════════════════════════════════════════════
# MongoDB Service
# ClusterIP: Internal access only
# ═══════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: taskmaster-dev
  labels:
    app: mongodb
    tier: database
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
    protocol: TCP
    name: mongodb
