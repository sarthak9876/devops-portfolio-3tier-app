# ═══════════════════════════════════════════════════════
# Frontend Deployment (React SPA)
# Served via nginx in production mode
# ═══════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskmaster-dev
  labels:
    app: frontend
    tier: presentation
spec:
  replicas: 3
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: frontend
  
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
      - name: frontend
        # ⚠️  UPDATE THIS WITH YOUR ECR IMAGE URI
        image: ${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/taskmaster-frontend:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        
        env:
        # API URL for frontend to call backend
        # This needs to be the LoadBalancer URL (we'll update this later)
        - name: VITE_API_URL
          value: "http://backend-service.taskmaster-dev.svc.cluster.local:5000"
        
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        
        # Liveness probe (simple HTTP check)
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
# ═══════════════════════════════════════════════════════
# Frontend Service (ClusterIP)
# Internal service, will be exposed via LoadBalancer
# ═══════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: taskmaster-dev
  labels:
    app: frontend
    tier: presentation
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
---
# ═══════════════════════════════════════════════════════
# Frontend LoadBalancer Service
# Public-facing AWS NLB for external access
# 
# Cost: ~$16/month (0.0225/hour for NLB)
# ═══════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: frontend-loadbalancer
  namespace: taskmaster-dev
  labels:
    app: frontend
    tier: presentation
  annotations:
    # AWS Load Balancer Controller annotations
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
