# ═══════════════════════════════════════════════════════
# ConfigMap: Application Configuration
# Non-sensitive environment variables
# ═══════════════════════════════════════════════════════


apiVersion: v1
kind: ConfigMap
metadata:
  name: taskmaster-config
  namespace: taskmaster-dev
  labels:
   app: taskmaster
   environment: dev
data:
  NODE_ENV: "production"
  MONGO_HOST: "mongodb-service.taskmaster-dev.svc.cluster.local"
  MONGO_PORT: "27017"
  MONGO_DATABASE: "taskmaster"

  API_PORT: "5000"
  VITE_API_URL: "http://backend-service.taskmaster-dev.svc.cluster.local:5000"

  CORS_ORIGIN: "*"
  LOG_LEVEL: "info"


